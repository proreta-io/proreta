  (include "proreta.env.request" .)
  (include "proreta.env.guard" .)
  (include "proreta.env.publicUrl" .)
  (include "proreta.env.api" .)) -}}
{{ include "proreta.backendDeployment" (dict "ctx" . "component" "api" "cfg" .Values.api "env" $env "httpPort" .Values.api.httpPort) }}
