{{- if .Values.httpRoute.enabled }}
{{- /* Host names first: a missing config.publicUrl is reported before a missing Gateway. */}}
{{- $hostnames := include "proreta.httpRoute.hostnames" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "proreta.fullname" . }}
  labels:
    {{- include "proreta.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "proreta.httpRoute.gatewayName" . }}
      {{- with .Values.httpRoute.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    {{- $hostnames | nindent 4 }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.apiPathPrefix }}
      timeouts:
        request: {{ .Values.httpRoute.apiRequestTimeout }}
      backendRefs:
        {{- /* group, kind and weight are the API server defaults, set explicitly so ArgoCD shows no drift. */}}
        - group: ""
          kind: Service
          name: {{ include "proreta.componentName" (dict "ctx" . "component" "api") }}
          port: {{ .Values.api.service.port }}
          weight: 1
    {{- if .Values.statuspage.enabled }}
    {{- /* Public status pages: /status and /status/... go to the renderer, nothing else. */}}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.httpRoute.statusPathPrefix }}
      timeouts:
        request: 15s
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "proreta.componentName" (dict "ctx" . "component" "statuspage") }}
          port: {{ .Values.statuspage.service.port }}
          weight: 1
    {{- end }}
    {{- /* Catch-all only when the frontend is deployed; otherwise unmatched paths 404 at the gateway. */}}
    {{- if .Values.web.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "proreta.componentName" (dict "ctx" . "component" "web") }}
          port: {{ .Values.web.service.port }}
          weight: 1
    {{- end }}
{{- end }}
