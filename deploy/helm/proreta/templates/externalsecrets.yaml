{{- if not .Values.externalSecrets.enabled }}
{{- range $n := list "admin" "crypto" "request" "statuspage" }}
{{- if and (eq (index $.Values.secrets $n).source "externalSecret") (or (ne $n "statuspage") $.Values.statuspage.enabled) }}
{{- fail (printf "secrets.%s.source=externalSecret needs externalSecrets.enabled=true (and the External Secrets Operator); use source: generate otherwise" $n) }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.externalSecrets.enabled }}
{{- if not .Values.externalSecrets.secretStoreRef.name }}
{{- fail "externalSecrets.enabled=true needs externalSecrets.secretStoreRef.name (and kind): the name of your SecretStore or ClusterSecretStore" }}
{{- end }}
{{- /* Wave -2: secrets exist before the migration hook (wave -1) and before workloads (wave 0).
       Only the Secrets whose secrets.<name>.source is externalSecret are rendered; with source
       generate the secrets bootstrap Job (wave -3) creates them instead.
       The database Secret is NOT rendered here: the database bootstrap Job (wave -3) creates it at runtime. */}}
{{- $es := .Values.externalSecrets }}
{{- $s := .Values.secrets }}
{{- $items := list }}
{{- if eq $s.admin.source "externalSecret" }}
{{- $items = append $items (dict "name" (include "proreta.secret.admin" .) "key" $s.admin.remoteKey "props" (list "login" "password_hash")) }}
{{- end }}
{{- if eq $s.crypto.source "externalSecret" }}
{{- $items = append $items (dict "name" (include "proreta.secret.crypto" .) "key" $s.crypto.remoteKey "props" (list "keys" "active_key_id")) }}
{{- end }}
{{- if eq $s.request.source "externalSecret" }}
{{- $items = append $items (dict "name" (include "proreta.secret.request" .) "key" $s.request.remoteKey "props" (list "keys" "active_key_id")) }}
{{- end }}
{{- if and .Values.statuspage.enabled (eq $s.statuspage.source "externalSecret") }}
{{- $items = append $items (dict "name" (include "proreta.secret.statuspage" .) "key" $s.statuspage.remoteKey "props" (list "cookie_key")) }}
{{- end }}
{{- if and .Values.statuspage.enabled (include "proreta.statusDomains.enabled" .) .Values.statuspage.customDomains.tlsAsk.enabled (not $s.tlsAsk.existingSecret) }}
{{- $items = append $items (dict "name" (include "proreta.secret.tlsAsk" .) "key" $s.tlsAsk.remoteKey "props" (list "token")) }}
{{- end }}
{{- if and (include "proreta.oauth.enabled" .) (not $s.oauth.existingSecret) }}
{{- $props := list }}
{{- range $p := list "google" "github" }}
{{- if (index $.Values.oauth $p).enabled }}
{{- $props = concat $props (list (printf "%s_client_id" $p) (printf "%s_client_secret" $p)) }}
{{- end }}
{{- end }}
{{- $items = append $items (dict "name" (include "proreta.secret.oauth" .) "key" $s.oauth.remoteKey "props" $props) }}
{{- end }}
{{- range $item := $items }}
---
apiVersion: {{ $es.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ $item.name }}
  labels:
    {{- include "proreta.labels" (dict "ctx" $ "component" "secrets") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ $item.name }}
    creationPolicy: {{ $es.creationPolicy }}
  data:
    {{- range $p := $item.props }}
    - secretKey: {{ $p }}
      remoteRef:
        key: {{ required (printf "secrets remoteKey is required for %s with source externalSecret" $item.name) $item.key }}
        property: {{ $p }}
    {{- end }}
{{- end }}
{{- end }}
