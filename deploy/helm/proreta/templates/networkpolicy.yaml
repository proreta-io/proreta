{{- if .Values.networkPolicy.enabled }}
# WARNING: effective only when the cluster CNI enforces NetworkPolicy.
# Ingress-only: egress is left open because monitor checks must reach arbitrary targets.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "proreta.fullname" . }}
  labels:
    {{- include "proreta.labels" (dict "ctx" . "component" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "proreta.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    # Gateway data plane -> api / web / statuspage
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "proreta.networkPolicy.gatewayNamespace" . }}
      ports:
        - {protocol: TCP, port: {{ .Values.api.httpPort }}}
        {{- if .Values.web.enabled }}
        - {protocol: TCP, port: {{ .Values.web.httpPort }}}
        {{- end }}
        {{- if and .Values.statuspage.enabled (ne (int .Values.statuspage.httpPort) (int .Values.api.httpPort)) }}
        - {protocol: TCP, port: {{ .Values.statuspage.httpPort }}}
        {{- end }}
        {{- if and .Values.speculagw.enabled (ne (int .Values.speculagw.httpPort) (int .Values.api.httpPort)) }}
        - {protocol: TCP, port: {{ .Values.speculagw.httpPort }}}
        {{- end }}
    # Metrics scraping of the admin port
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - {protocol: TCP, port: {{ .Values.config.adminPort }}}
{{- if and .Values.statuspage.enabled (include "proreta.statusDomains.enabled" .) .Values.statuspage.customDomains.tlsAsk.enabled }}
{{- $ask := .Values.statuspage.customDomains.tlsAsk }}
---
# The TLS ask port of the statuspage pods: only the proxy below may reach it. Policies add up, so
# every other source stays denied by the policy above, which does not list this port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "proreta.fullname" . }}-tls-ask
  labels:
    {{- include "proreta.labels" (dict "ctx" . "component" "statuspage") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "proreta.selectorLabels" (dict "ctx" . "component" "statuspage") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - {{- with $ask.proxy.namespace }}
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
          {{- end }}
          {{- with $ask.proxy.podSelector }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - {protocol: TCP, port: {{ $ask.port }}}
{{- end }}
{{- end }}
