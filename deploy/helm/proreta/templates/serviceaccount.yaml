{{- /* One ServiceAccount per workload; no API token is mounted (automountServiceAccountToken: false).
       Sole exception: the db-bootstrap ServiceAccount, see dbbootstrap.yaml. */ -}}
{{- $components := list "api" "worker" "jobs" }}
{{- if .Values.web.enabled }}{{ $components = append $components "web" }}{{ end }}
{{- if .Values.statuspage.enabled }}{{ $components = append $components "statuspage" }}{{ end }}
{{- if .Values.speculagw.enabled }}{{ $components = append $components "speculagw" }}{{ end }}
{{- range $c := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "proreta.componentName" (dict "ctx" $ "component" $c) }}
  labels:
    {{- include "proreta.labels" (dict "ctx" $ "component" $c) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
---
# Migration ServiceAccount. It must exist before the migrate hook Job, so it is a hook in the same
# phase (ArgoCD: Sync wave -2, or PreSync; Helm: pre-install/pre-upgrade weight -2).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "proreta.componentName" (dict "ctx" . "component" "migrate") }}
  labels:
    {{- include "proreta.labels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: {{ .Values.migration.hookPhase }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- if eq .Values.migration.hookPhase "PreSync" }}
    argocd.argoproj.io/sync-wave: "-1"
    {{- else }}
    argocd.argoproj.io/sync-wave: "-2"
    {{- end }}
    {{- include "proreta.helmHook" (dict "weight" "-2") | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
