{{- if and .Values.database.bootstrap.enabled (eq .Values.migration.hookPhase "PreSync") }}
{{- fail "migration.hookPhase=PreSync would run the migrate Job before the database bootstrap Job (Sync hook); use Sync or set database.bootstrap.enabled=false" }}
{{- end }}
{{- $name := include "proreta.componentName" (dict "ctx" . "component" "migrate") }}
{{- $sel := dict "ctx" . "component" "migrate" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "proreta.labels" $sel | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: {{ .Values.migration.hookPhase }}
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- if ne .Values.migration.hookPhase "PreSync" }}
    argocd.argoproj.io/sync-wave: "-1"
    {{- end }}
    {{- include "proreta.helmHook" (dict "weight" "-1" "job" true) | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "proreta.labels" $sel | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "proreta.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/migrate"]
          env:
            - name: PRORETA_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PRORETA_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "proreta.secret.db" . }}
                  key: owner_url
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- include "proreta.scheduling" $sel | nindent 6 }}
