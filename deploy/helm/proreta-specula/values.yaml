# Defaults of the Proreta Specula chart. Every key is validated by values.schema.json: unknown keys
# are rejected. Required, with no default: proreta.url and token.existingSecret.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/proreta-io/proreta-specula
  # A release version such as 1.2.3 or a manual test build, sha-<first 7 hex>. Empty: the chart's
  # appVersion, which is the release version for a chart installed from
  # oci://ghcr.io/proreta-io/charts/proreta-specula. A chart from a git checkout has no usable
  # appVersion, so the tag is REQUIRED there.
  tag: ""
  # Optional content digest, sha256:<64 hex>. When set it replaces the tag (repository@digest).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

proreta:
  # PRORETA_URL: the address of your Proreta installation, https, no trailing slash. The executor
  # calls <url>/specula/v1 and must be able to reach it.
  url: ""

token:
  # The name of a Secret you create in the namespace that holds the token shown once when the
  # Specula was registered in the app. Create it without putting the token in a file or in your
  # shell history, for example:
  #   kubectl -n proreta-specula create secret generic proreta-specula-token --from-file=token=/dev/stdin
  # (paste the token, then press Ctrl-D).
  existingSecret: ""
  key: token

# One pod per Specula. The executor runs its checks from a schedule it keeps locally, so a second
# pod with the same token would run every check twice (Proreta stores one result per slot and
# warns about a duplicate instance). The Deployment uses the Recreate strategy so the old pod stops
# before the new one starts. 0 stops the executor.
replicas: 1

# Where the executor keeps its cached schedule and the buffer of results it could not send yet.
# The default is an emptyDir: it survives a container restart but not the replacement of the pod
# (a rollout, an eviction, a node drain), and a pod replaced while the link to Proreta is down
# loses what was buffered. enabled: false mounts nothing: the executor then keeps everything in
# memory and reports itself degraded, and a restart while Proreta is unreachable stops its checks.
state:
  enabled: true
  mountPath: /var/lib/specula       # PRORETA_SPECULA_STATE_DIR
  # Room for the buffer (256 MiB by default) plus the schedule; the pod is evicted above it.
  sizeLimit: 512Mi
  # Keep the state on a volume that outlives the pod. Give the name of a PersistentVolumeClaim
  # that you created in the release namespace (at least 1Gi; the chart does not create one, so
  # that helm uninstall never deletes your data). The buffer, the cached schedule and the instance
  # id then survive a rollout, an eviction or a drain. Supported: a ReadWriteOnce claim together
  # with the Recreate strategy and one replica, which keep a single writer. ReadWriteMany is not
  # supported. Empty keeps the emptyDir above; sizeLimit does not apply to a claim.
  persistence:
    existingClaim: ""

specula:
  concurrency: 20          # PRORETA_SPECULA_CONCURRENCY, checks in flight per pod
  pollInterval: 5s         # PRORETA_SPECULA_POLL_INTERVAL
  logLevel: info
  adminPort: 9090          # PRORETA_ADMIN_ADDR, health and metrics

# A ServiceMonitor for the admin port /metrics (needs the Prometheus Operator CRDs). Also creates
# a Service for that port. labels are added to the ServiceMonitor, for example the one your
# Prometheus selects on ({release: prometheus}).
serviceMonitor:
  enabled: false
  interval: 30s
  path: /metrics
  labels: {}

resources:
  requests: {cpu: 25m, memory: 48Mi}
  limits: {cpu: 500m, memory: 192Mi}

terminationGracePeriodSeconds: 45   # the executor drains running checks for up to 15 s

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
# Extra environment variables (Kubernetes EnvVar objects), for example a proxy for the call to Proreta:
# [{name: HTTPS_PROXY, value: "http://proxy.internal:3128"}]. Checks never use a proxy.
env: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile: {type: RuntimeDefault}
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
