openapi: 3.0.3
info:
  title: Proreta Specula API
  version: 1.0.0
  contact:
    name: Proreta maintainers
    url: https://github.com/proreta-io/proreta
  description: |
    The API that a Specula executor calls. A Specula runs inside a customer's network, where the
    services it checks cannot be reached from outside, and only makes outbound HTTPS calls to
    this API (served by the gateway at the same address as Proreta under `/specula/v1`).

    Every call carries the Specula's token as `Authorization: Bearer spc_...`. The token is created
    when the Specula is registered, shown once, and can be revoked at any time (401 from then on).
    A token belongs to one organization and one Specula; what a call can reach is decided by the
    token, never by the request.

    Two modes, chosen by the executor with the `capabilities` of its `hello` (the latest `hello`
    decides, so a downgrade returns to pull mode at once):

    *Pull mode.* `hello` at start and every minute, `claim` every few seconds for due checks (each
    comes with a 30 second lease), run them, report with `results`. A result for a lease that has
    expired or was already completed answers `stale` and must not be sent again.

    *Schedule mode* (`schedule/1`). The executor fetches its schedule with `schedule`, runs every
    check at `anchor + n * intervalSeconds` on its own clock until the schedule's `validUntil`,
    keeps the results in a buffer and sends them with `reports`, naming the slot of each. A slot is
    stored only if it exists in the monitor's schedule (epoch), is not older than the server's
    backlog and not in the future; it is recorded with the slot as its time. `claim` answers no
    jobs for a location in schedule mode. A `404` on `schedule` or `reports` means an older
    server: stay in pull mode.

    *Versioning rule.* A `schedule/1` request or response never gains a field: both sides reject
    unknown fields (an older gateway answers a `hello` or `reports` with an unknown field with
    `400`, and an executor retries a `400` on `reports` for ever, because it keeps its buffer). A
    new field needs a new capability (`schedule/2`), announced in `hello` and offered in `modes`.
    Upgrade the gateway first.
servers:
  - url: https://proreta.example.com
    description: Example installation; the executor calls the address of its Proreta
tags:
  - name: specula
    description: Calls made by a Specula executor
paths:
  /specula/v1/hello:
    post:
      operationId: speculaHello
      tags: [specula]
      summary: Report the executor's version and host name
      description: |
        Sent at start and every minute. The answer carries the server's clock, to notice a skew;
        the `capabilities` of the latest `hello` decide pull or schedule mode.
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HelloRequest"}
      responses:
        "200":
          description: Accepted; the server's clock is returned to notice a large skew
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HelloResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /specula/v1/claim:
    post:
      operationId: speculaClaim
      tags: [specula]
      summary: Lease up to `max` due checks of this Specula's location
      description: |
        Only for an executor in pull mode. Each job comes with a 30 second lease; report it with
        `results` before the lease ends.
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClaimRequest"}
      responses:
        "200":
          description: The leased jobs, possibly none
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClaimResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /specula/v1/results:
    post:
      operationId: speculaResults
      tags: [specula]
      summary: Report finished checks
      description: |
        Only for an executor in pull mode. A result for a lease that has expired or was already
        completed answers `stale` and must not be sent again.
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResultsRequest"}
      responses:
        "200":
          description: One outcome per result, in request order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResultsResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503":
          description: Busy; nothing was written, send the same batch again after `Retry-After` seconds
  /specula/v1/schedule:
    get:
      operationId: speculaSchedule
      tags: [specula]
      summary: Fetch the schedule of this Specula's location
      description: |
        Only for an executor in schedule mode. Send the last `version` in `If-None-Match`; an
        unchanged schedule answers 304 and extends `validUntil` (the new value is in the
        `X-Schedule-Valid-Until` header). Request headers and bodies of the monitors are secrets and
        are included.
      security: [{bearer: []}]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: {type: string}
      responses:
        "200":
          description: The schedule
          headers:
            ETag: {schema: {type: string}, description: "The `version`, quoted"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Schedule"}
        "304":
          description: Not changed
          headers:
            X-Schedule-Valid-Until: {schema: {type: string, format: date-time}, description: "The extended `validUntil`"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413":
          description: More than 5000 monitors are placed at this location; no schedule is served until some are moved or removed
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /specula/v1/reports:
    post:
      operationId: speculaReports
      tags: [specula]
      summary: Report finished checks by slot
      description: |
        Only for an executor in schedule mode. Send results oldest first. Every outcome except a
        failure of the whole call is final: the executor discards the result and never sends it
        again. A `429` or `503` stores nothing; send the same batch again after `Retry-After`
        seconds.
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReportsRequest"}
      responses:
        "200":
          description: One outcome per result, in request order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ReportsResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413":
          description: The body is larger than the limit (more than 100 results or too many bytes); nothing was written, send smaller batches
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "503":
          description: Busy; nothing was written, send the same batch again after `Retry-After` seconds
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: The token is missing, unknown or revoked, or the organization is not active
    BadRequest:
      description: The body is not valid for this call
    TooManyRequests:
      description: Over the limit of this token; nothing was done, call again after `Retry-After` seconds
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
  schemas:
    HelloRequest:
      type: object
      additionalProperties: false
      required: [version, hostname]
      properties:
        version: {type: string, maxLength: 64}
        hostname: {type: string, maxLength: 253}
        capabilities:
          type: array
          maxItems: 16
          items: {type: string, maxLength: 32}
          description: "What this executor can do: `tcp` (runs tcp checks), `schedule/1` (schedule mode). Absent means none: pull mode, http jobs only. An older server rejects a `hello` with fields it does not know (400); send them only after a plain `hello` succeeded and `schedule` answered 200."
        instanceId: {type: string, maxLength: 64, description: "Random per process; two ids from one token within minutes mean two executors share it"}
        scheduleIssuedAt: {type: string, format: date-time, description: "`issuedAt` of the schedule in use"}
        bufferDepth: {type: integer, minimum: 0, description: "Results waiting to be sent"}
        oldestUnsentAt: {type: string, format: date-time, description: "Slot of the oldest result waiting to be sent"}
        bufferDegraded: {type: boolean, description: "The result buffer is in memory only (no usable state directory)"}
        clockOffsetMs: {type: integer, format: int64, minimum: -1000000000000, maximum: 1000000000000, description: "The server's time minus the executor's corrected clock in milliseconds, as last measured (positive: the executor's clock is behind). Absent before the first measurement; an older server rejects it like the other fields."}
    HelloResponse:
      type: object
      required: [serverTime]
      properties:
        serverTime: {type: string, format: date-time}
        modes:
          type: array
          items: {type: string, enum: [pull, schedule/1]}
          description: Modes this server offers; absent on an older server (pull only)
        scheduleVersion: {type: string, description: "Current `version` of this location's schedule; fetch the schedule when it differs from the one in use"}
    ClaimRequest:
      type: object
      additionalProperties: false
      required: [max]
      properties:
        max: {type: integer, minimum: 1, maximum: 50}
    Header:
      type: object
      required: [name, value]
      properties:
        name: {type: string}
        value: {type: string, description: "A secret of the monitor; do not log it"}
    Job:
      type: object
      required: [monitorId, leaseToken, leaseUntil, url, method, expectedStatus, timeoutSeconds]
      properties:
        monitorId: {type: string, format: uuid}
        leaseToken: {type: string, format: uuid, description: "Send it back with the result"}
        leaseUntil: {type: string, format: date-time}
        type:
          type: string
          enum: [http, tcp]
          description: "The kind of check; absent means `http`. A `tcp` job connects to `host`:`port` and is up when the handshake completes: `url`, `method` and `expectedStatus` are then unused (empty, GET and 2xx) and the result has no status code. An executor that does not know a type must not run the job."
        url: {type: string}
        host: {type: string, description: "Only for a `tcp` job"}
        port: {type: integer, minimum: 1, maximum: 65535, description: "Only for a `tcp` job"}
        method: {type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE]}
        headers: {type: array, items: {$ref: "#/components/schemas/Header"}}
        body: {type: string, description: "A secret of the monitor; do not log it"}
        expectedStatus: {type: string, description: "`2xx` or an exact status code"}
        timeoutSeconds: {type: integer}
    ClaimResponse:
      type: object
      required: [jobs]
      properties:
        jobs: {type: array, items: {$ref: "#/components/schemas/Job"}}
    Result:
      type: object
      additionalProperties: false
      required: [monitorId, leaseToken, checkedAt, ok]
      properties:
        monitorId: {type: string, format: uuid}
        leaseToken: {type: string, format: uuid}
        checkedAt: {type: string, format: date-time, description: "Within the last 10 minutes and not in the future"}
        ok: {type: boolean}
        statusCode: {type: integer, minimum: 100, maximum: 599}
        latencyMs: {type: integer, minimum: 0}
        errorKind:
          type: string
          description: Empty exactly when `ok` is true
          enum: [dns, connect, tls, timeout, blocked_address, bad_port, redirect, unexpected_status, other]
        tlsNotAfter: {type: string, format: date-time}
    ResultsRequest:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results: {type: array, minItems: 1, maxItems: 100, items: {$ref: "#/components/schemas/Result"}}
    ResultOutcome:
      type: object
      required: [monitorId, outcome]
      properties:
        monitorId: {type: string, format: uuid}
        outcome:
          type: string
          description: |
            `recorded`: stored and applied. `stale`: the lease expired or was completed, or this is a
            repeat; discard it. `rejected`: malformed, or refused by the database for good; discard it.
          enum: [recorded, stale, rejected]
    ResultsResponse:
      type: object
      required: [outcomes]
      properties:
        outcomes: {type: array, items: {$ref: "#/components/schemas/ResultOutcome"}}
    ScheduledMonitor:
      type: object
      required: [monitorId, epoch, active, anchor, intervalSeconds, timeoutSeconds, url, method, expectedStatus]
      properties:
        monitorId: {type: string, format: uuid}
        epoch: {type: integer, minimum: 1, description: "Changes whenever the monitor's schedule changes; results name it"}
        active: {type: boolean, description: "False: stop checking this monitor (its results for slots after the end of the epoch are refused)"}
        anchor: {type: integer, format: int64, description: "Unix seconds; the slots are `anchor + n * intervalSeconds`, n >= 0"}
        intervalSeconds: {type: integer, minimum: 1}
        timeoutSeconds: {type: integer, minimum: 1}
        type:
          type: string
          enum: [http, tcp]
          description: "As in `Job`; absent means `http`. An executor that does not know a type must not run the monitor."
        url: {type: string}
        host: {type: string, description: "Only for a `tcp` monitor"}
        port: {type: integer, minimum: 1, maximum: 65535, description: "Only for a `tcp` monitor"}
        method: {type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE]}
        headers: {type: array, items: {$ref: "#/components/schemas/Header"}}
        body: {type: string, description: "A secret of the monitor; do not log it"}
        expectedStatus: {type: string, description: "`2xx` or an exact status code"}
    Schedule:
      type: object
      required: [version, serverTime, issuedAt, validUntil, refreshAfterSeconds, monitors]
      properties:
        version: {type: string, description: "Changes whenever anything below changes; also the ETag"}
        serverTime: {type: string, format: date-time}
        issuedAt: {type: string, format: date-time}
        validUntil: {type: string, format: date-time, description: "Stop starting checks at this time unless a newer schedule or a 304 extended it"}
        refreshAfterSeconds: {type: integer, minimum: 1}
        monitors:
          type: array
          maxItems: 5000
          items: {$ref: "#/components/schemas/ScheduledMonitor"}
    Report:
      type: object
      additionalProperties: false
      required: [monitorId, epoch, slot, ok]
      properties:
        monitorId: {type: string, format: uuid}
        epoch: {type: integer, minimum: 1}
        slot: {type: integer, format: int64, description: "Unix seconds, `anchor + n * intervalSeconds` of that epoch; stored as the time of the check"}
        ok: {type: boolean}
        statusCode: {type: integer, minimum: 100, maximum: 599}
        latencyMs: {type: integer, minimum: 0}
        errorKind:
          type: string
          description: Empty exactly when `ok` is true
          enum: [dns, connect, tls, timeout, blocked_address, bad_port, redirect, unexpected_status, other]
        tlsNotAfter: {type: string, format: date-time}
    ReportsRequest:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results: {type: array, minItems: 1, maxItems: 100, items: {$ref: "#/components/schemas/Report"}}
    ReportOutcome:
      type: object
      required: [monitorId, slot, outcome]
      properties:
        monitorId: {type: string, format: uuid}
        slot: {type: integer, format: int64}
        outcome:
          type: string
          description: |
            `recorded`: stored and applied. `duplicate`: the slot already has a result (a retry);
            nothing to do. `superseded`: the slot is outside the time the epoch was active, or the
            epoch is not the monitor's. `expired`: older than the backlog the server accepts.
            `rejected`: malformed, in the future, not a slot of the epoch, or a monitor this
            Specula does not know. All are final: discard the result.
          enum: [recorded, duplicate, superseded, expired, rejected]
    ReportsResponse:
      type: object
      required: [scheduleVersion, outcomes]
      properties:
        scheduleVersion: {type: string, description: "Current `version` of this location's schedule"}
        outcomes: {type: array, items: {$ref: "#/components/schemas/ReportOutcome"}}
