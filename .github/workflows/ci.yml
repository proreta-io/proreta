name: ci

# Full CI runs on every pull request, whatever its base branch, so a stacked series is checked before
# it is retargeted to main, on every push to main (the merged result is tested as such), by hand, and
# as the first job of a tag build (release.yml calls it). The single required status check is `ci-ok`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # Path of the OpenAPI contract.
  OPENAPI_SPEC: api/openapi.yaml
  # The wire contract between the gateway and the executors in customer networks; executors are
  # upgraded on their own schedule, so it gets the same lint and breaking-change check.
  SPECULA_SPEC: api/specula.yaml
  # Helm used by every job here; must match the pin in release.yml (job chart).
  HELM_VERSION: v3.18.6

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: TODOs reference an issue
        run: bash scripts/check-todos.sh
      - name: No internal record references
        run: bash scripts/check-internal-refs.sh
      - name: Actions pinned to a commit, no floating tool versions
        run: |
          set -euo pipefail
          if grep -nE '^\s*(-\s+)?uses:\s' .github/workflows/*.yml | grep -vE 'uses:\s+\./' | grep -vE '@[0-9a-f]{40}(\s|$)'; then
            echo "::error::a uses: reference is not pinned to a 40-character commit SHA"
            exit 1
          fi
          if grep -nE '@lates[t]' .github/workflows/*.yml scripts/*.sh Makefile; then
            echo "::error::a floating latest version is not a pin"
            exit 1
          fi
      - name: Install shellcheck (pinned, checksum verified)
        env:
          SHELLCHECK_VERSION: 0.11.0
          # linux.x86_64 tarball of the release above (the release publishes no checksums file).
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/shellcheck"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $dir/shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf "$dir/shellcheck.tar.xz" -C "$dir" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S style
      - name: Migration file naming
        run: |
          set -euo pipefail
          dir=backend/migrations
          if [ ! -d "$dir" ]; then
            echo "No ${dir}; skipping."
            exit 0
          fi
          fail=0
          shopt -s nullglob
          for f in "$dir"/*.sql; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            if ! [[ "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=${f}::migration name must be <14-digit timestamp>_<snake_case>.sql"
              fail=1
              continue
            fi
            if grep -q '+goose Down' "$f"; then
              echo "::error file=${f}::migrations are forward-only: remove '+goose Down'"
              fail=1
            fi
          done
          dups=$(find "$dir" -maxdepth 1 -type f -name '*.sql' -exec basename {} \; | cut -c1-14 | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::duplicate migration timestamps: ${dups}"
            fail=1
          fi
          exit "$fail"

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks binary (MIT) instead of gitleaks-action, which needs a licence key for organizations.
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          # linux_x64 line of the checksums file of the release above.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - name: Scan the history for secrets
        run: gitleaks git --redact --no-banner --exit-code 1 .

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          # linux_amd64 line of the checksums file of the release above.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/actionlint"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/actionlint.tar.gz" -C "$dir" actionlint
          echo "$dir" >> "$GITHUB_PATH"
      - name: Lint workflows
        run: actionlint -color

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' }}
      helm: ${{ github.event_name != 'pull_request' || steps.filter.outputs.helm == 'true' }}
      web: ${{ github.event_name != 'pull_request' || steps.filter.outputs.web == 'true' }}
      images: ${{ github.event_name != 'pull_request' || steps.filter.outputs.images == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every event other than a pull request runs every job; the filter only applies to pull requests.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'api/**'
              - 'sqlc.yaml'
              - 'Dockerfile'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            api:
              - 'api/**'
              - '.github/spectral.yaml'
              - 'scripts/strip-experimental.py'
              - '.github/workflows/ci.yml'
            helm:
              - 'deploy/helm/**'
              - 'scripts/validate-chart.sh'
              - 'scripts/check-rendered-chart.py'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'api/**'
              - '.github/workflows/ci.yml'
            images:
              - 'Dockerfile'
              - 'Dockerfile.specula'
              - '.dockerignore'
              - 'backend/**'
              - 'web/**'
              - '.github/workflows/ci.yml'

  # PostgreSQL 16 is the supported version and the one the guides use; the suite runs on it.
  backend:
    name: backend (postgres 16)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        # postgres 16 minor 16.15, multi-arch index digest. Dependabot does not scan
        # workflow service images: refresh by hand, see "Database image pin" in docs/development.md
        image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; credentials are not secrets.
      # SUPERUSER on a scratch Postgres: integration tests create and drop their own databases/roles.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The race detector doubles the test time, so a pull request runs the same tests without it;
      # every push to main, tag build (release.yml) and manual run keeps -race.
      - name: Race detector on everything but pull requests
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then echo "RACE=" >> "$GITHUB_ENV"; else echo "RACE=-race" >> "$GITHUB_ENV"; fi
      - name: Test
        run: scripts/ci-test.sh "$RUNNER_TEMP/test.log" make test
      # No gate for now; the number is for reading.
      - name: Coverage report
        working-directory: backend
        run: go tool cover -func=coverage.out | tail -n 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 14
      # TEST_DATABASE_ADMIN_URL comes from the job env above, like the normal tests.
      - name: End-to-end test (proretatest build tag)
        run: scripts/ci-test.sh "$RUNNER_TEMP/test-e2e.log" make test-e2e
      - name: Upload the test output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-output-postgres-16
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/test-e2e.log
          if-no-files-found: ignore
          retention-days: 14

  # The two checks that do not need the database, off the critical path of `backend` (the tests).
  backend-checks:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # The generators are built from their own module (backend/tools), so its sums key the cache too.
          cache-dependency-path: |
            backend/go.sum
            backend/tools/go.sum
      - name: Generated code is up to date
        run: make check-generated
      # Pinned by version (the Go checksum database verifies the module). The toolchain is the one
      # in go.mod, the same as the release image; any reachable advisory fails the job.
      - name: Known vulnerabilities (govulncheck)
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Separate from `backend` so a lint finding never hides the test and e2e results.
  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Deviation from `make lint`: the action installs golangci-lint (with its cache) and runs it
      # in backend/. Keep flags in sync with the Makefile `lint` target.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend

  # Builds the images as the release does (amd64 only, nothing pushed), so a broken Dockerfile or
  # .dockerignore fails the pull request instead of the tag build.
  images:
    name: image (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            file: Dockerfile
          - name: web
            context: web
            file: web/Dockerfile
          - name: specula
            context: .
            file: Dockerfile.specula
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          # Reads the cache the release builds write (shared with the default branch); writes none.
          cache-from: type=gha,scope=${{ matrix.name }}

  api-contract:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lint OpenAPI (spectral)
        run: |
          set -euo pipefail
          # Locked by scripts/spectral/package-lock.json (integrity hashes); npm ci fails on any mismatch.
          npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/spectral
          scripts/spectral/node_modules/.bin/spectral lint "$OPENAPI_SPEC" "$SPECULA_SPEC" --ruleset .github/spectral.yaml --fail-severity warn
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          # The toolchain of go.mod, not "stable", so the oasdiff build does not change under us.
          go-version-file: backend/go.mod
          cache: false
      - name: Breaking-change check (oasdiff vs base branch)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "origin/${BASE_REF}:${OPENAPI_SPEC}" 2>/dev/null; then
            echo "No ${OPENAPI_SPEC} on base branch; skipping breaking-change check."
            exit 0
          fi
          git show "origin/${BASE_REF}:${OPENAPI_SPEC}" > "${RUNNER_TEMP}/base-full.yaml"
          # Operations marked x-experimental: true may change freely, so both specs are compared without them
          # (an operation that is stable on the base and experimental on the head shows up as removed).
          python3 scripts/strip-experimental.py "${RUNNER_TEMP}/base-full.yaml" > "${RUNNER_TEMP}/base-openapi.yaml"
          python3 scripts/strip-experimental.py "$OPENAPI_SPEC" > "${RUNNER_TEMP}/head-openapi.yaml"
          # Pinned by version; the Go checksum database verifies the module.
          go install github.com/oasdiff/oasdiff@v1.37.0
          # Exceptions need an ADR and go into api/oasdiff-err-ignore.txt (empty from 1.0).
          "$(go env GOPATH)/bin/oasdiff" breaking "${RUNNER_TEMP}/base-openapi.yaml" "${RUNNER_TEMP}/head-openapi.yaml" --fail-on ERR \
            --err-ignore api/oasdiff-err-ignore.txt --severity-levels api/oasdiff-severity-levels.txt
          if git cat-file -e "origin/${BASE_REF}:${SPECULA_SPEC}" 2>/dev/null; then
            git show "origin/${BASE_REF}:${SPECULA_SPEC}" > "${RUNNER_TEMP}/base-specula.yaml"
            "$(go env GOPATH)/bin/oasdiff" breaking "${RUNNER_TEMP}/base-specula.yaml" "$SPECULA_SPEC" --fail-on ERR \
              --err-ignore api/oasdiff-err-ignore.txt --severity-levels api/oasdiff-severity-levels.txt
          else
            echo "No ${SPECULA_SPEC} on base branch; skipping its breaking-change check."
          fi

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated client is up to date
        run: |
          npm run gen:api
          if [ -n "$(git status --porcelain -- src/api/generated)" ]; then
            git status --porcelain -- src/api/generated
            echo "::error::web/src/api/generated is stale: run 'npm run gen:api' in web/ and commit the result"
            exit 1
          fi
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unused files, exports and dependencies
        run: npm run knip
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install PyYAML (chart invariant checks)
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/venv"
          "${RUNNER_TEMP}/venv/bin/pip" install --quiet --require-hashes -r scripts/requirements-ci.txt
          echo "${RUNNER_TEMP}/venv/bin" >> "$GITHUB_PATH"
      - name: Install kubeconform (pinned, checksum verified)
        env:
          KUBECONFORM_VERSION: v0.8.0
          # linux-amd64 line of the CHECKSUMS file of the release above.
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/kubeconform"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $dir/kubeconform.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/kubeconform.tar.gz" -C "$dir" kubeconform
          echo "$dir" >> "$GITHUB_PATH"
      # Schemas of the three CRD kinds the chart renders, from datreeio/CRDs-catalog (MIT) at a pinned
      # commit, each checked against a SHA-256 so a changed file fails the job.
      - name: Fetch CRD schemas (pinned, checksum verified)
        env:
          CATALOG_COMMIT: 784ec895547a36e548e6810b41f27baade3a0890
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/crd-schemas"
          while read -r sha file; do
            mkdir -p "$dir/$(dirname "$file")"
            curl -fsSL -o "$dir/$file" "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CATALOG_COMMIT}/$file"
            echo "$sha  $dir/$file" | sha256sum --check --strict
          done <<'EOF'
          e5692e62edd9b8a14bd2527d0a732e174a649131aa4d47159737dc6527c59ca5 gateway.networking.k8s.io/httproute_v1.json
          7634aa711997c50e952970bc149fad4b2ac9e1fbc90047bc43e28e8c2682d570 external-secrets.io/externalsecret_v1.json
          78062f4c2364bf6056a8df40cfb7039936f836014aff2078c0c598dfce69c51e monitoring.coreos.com/servicemonitor_v1.json
          EOF
          echo "CRD_SCHEMA_DIR=$dir" >> "$GITHUB_ENV"
      - name: Validate chart (helm lint, helm template, invariants, kubeconform)
        run: bash scripts/validate-chart.sh

  # The one required status check. Jobs skipped by the path filter (or because `changes` failed)
  # report "skipped", which a branch rule does not reliably treat as a pass, so this job decides:
  # it always runs and fails when any job it needs failed or was cancelled.
  ci-ok:
    if: always()
    needs: [repo-hygiene, secrets-scan, actionlint, changes, backend, backend-checks, backend-lint, images, api-contract, web, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed or were skipped by the path filter
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error::at least one CI job failed or was cancelled"
            exit 1
          fi
