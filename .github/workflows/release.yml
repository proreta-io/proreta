name: release

# Tests run on the pull request and on every push to main (ci.yml, required check `ci-ok`). A tag
# build runs ci.yml first (job `ci`) and publishes nothing unless it is green; a push to main builds
# images without waiting for it.
# Builds and pushes the multi-arch backend and web images to ghcr.io.
# - push to main: tags `sha-<7 hex>` and `main`.
# - tag vX.Y.Z: tags `X.Y.Z`, `X.Y` and `X` (semver, no `latest`; no moving `X` while X is 0), and the Helm charts as the OCI
#   artifacts oci://ghcr.io/proreta-io/charts/proreta and .../proreta-specula, version X.Y.Z (job `chart`, tags only; a
#   prerelease tag vX.Y.Z-rc.1 gives the chart version X.Y.Z-rc.1).
# After the charts, job `finalize` checks the published artifacts anonymously and creates the GitHub
# release (marked pre-release when the version has a suffix such as -rc.1).
# Every image carries the labels org.opencontainers.image.revision (the commit) and
# org.opencontainers.image.source. The workflow only publishes images; it never commits.
# Path filters apply to branch pushes only; GitHub does not evaluate them for tag pushes.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - backend/**
      - api/**
      - Dockerfile
      - web/**
      - .github/workflows/release.yml
  workflow_dispatch:

# Serialise releases per ref; never cancel a run that is pushing an image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Tags only: the tag must be vX.Y.Z[-pre], point at a commit that is on main, and pass the full CI.
  verify-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag format and branch
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-<prerelease>"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-tag
    uses: ./.github/workflows/ci.yml
    # The permissions ci.yml asks for per job; a called workflow cannot have more than its caller gives.
    permissions:
      contents: read
      pull-requests: read

  image:
    # Runs for main (ci and verify-tag skipped) and for a tag whose ci passed; never after a failure, and
    # a manual run from another branch publishes nothing.
    needs: [verify-tag, ci]
    if: ${{ !cancelled() && !failure() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/proreta-io/proreta-backend
            context: .
            file: Dockerfile
          - name: web
            image: ghcr.io/proreta-io/proreta-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute version
        id: vars
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="sha-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Tags only: the chart version and appVersion are the release (vX.Y.Z[-pre] -> X.Y.Z[-pre]), so the packaged
  # chart defaults image.tag to the images built above. Never runs for pushes to main.
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in step with HELM_VERSION in ci.yml.
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.18.6
      - name: Package and push the chart
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-<prerelease>" >&2
            exit 1
          fi
          # The chart has no defaults for config.publicUrl and the Gateway: lint with the example values.
          helm lint --strict deploy/helm/proreta -f deploy/helm/proreta/values.example.yaml --set image.tag="$version"
          helm package deploy/helm/proreta --version "$version" --app-version "$version" -d "$RUNNER_TEMP/chart"
          # The Specula executor chart: it needs the URL and the token Secret.
          helm lint --strict deploy/helm/proreta-specula --set image.tag="$version" --set proreta.url=https://proreta.example.com --set token.existingSecret=specula-token
          helm package deploy/helm/proreta-specula --version "$version" --app-version "$version" -d "$RUNNER_TEMP/chart"
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "$RUNNER_TEMP/chart/proreta-${version}.tgz" oci://ghcr.io/proreta-io/charts
          helm push "$RUNNER_TEMP/chart/proreta-specula-${version}.tgz" oci://ghcr.io/proreta-io/charts
          helm registry logout ghcr.io

  # Tags only, after the images and charts: anonymous reads prove that the packages are public and
  # carry both platforms, then the GitHub release is created (notes from docs/release-notes/X.Y.Z.md
  # when that file exists for the version without its suffix, a short pointer otherwise).
  finalize:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.18.6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Published artifacts are public and complete (no login)
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for img in proreta-backend proreta-web; do
            out=$(docker buildx imagetools inspect "ghcr.io/proreta-io/${img}:${version}")
            for platform in linux/amd64 linux/arm64; do
              grep -q "Platform:.*${platform}" <<<"$out" || { echo "::error::${img}:${version} has no ${platform}"; exit 1; }
            done
          done
          for chart in proreta proreta-specula; do
            out=$(helm show chart "oci://ghcr.io/proreta-io/charts/${chart}" --version "$version")
            grep -q "^version: ${version}\$" <<<"$out" || { echo "::error::chart ${chart} is not version ${version}"; exit 1; }
            grep -q "^appVersion: \"\?${version}\"\?\$" <<<"$out" || { echo "::error::chart ${chart} has another appVersion"; exit 1; }
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # A release made by hand before the run is kept as it is.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists; leaving it"
            exit 0
          fi
          flags=()
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          notes="docs/release-notes/${version%%-*}.md"
          if [ -f "$notes" ]; then
            flags+=(--notes-file "$notes")
          else
            flags+=(--notes "Release ${version}. Images ghcr.io/proreta-io/proreta-backend:${version} and proreta-web:${version}, charts oci://ghcr.io/proreta-io/charts/proreta and proreta-specula at version ${version}. See docs/release-notes/ in this tag and docs/install.md.")
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Proreta ${version}" "${flags[@]}"
