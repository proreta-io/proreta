name: release

# Tests run on the pull request (ci.yml, required check `ci-ok`); this workflow only builds and
# publishes images after a squash merge to main or a tag. It does not depend on ci.yml.
# Builds and pushes the multi-arch backend and web images to ghcr.io.
# - push to main: tags `sha-<7 hex>` and `main`.
# - tag vX.Y.Z: tags `X.Y.Z`, `X.Y` and `X` (semver, no `latest`; no moving `X` while X is 0), and the Helm chart as the OCI
#   artifact oci://ghcr.io/proreta-io/charts/proreta, version X.Y.Z (job `chart`, tags only; a
#   prerelease tag vX.Y.Z-rc.1 gives the chart version X.Y.Z-rc.1).
# Every image carries the labels org.opencontainers.image.revision (the commit) and
# org.opencontainers.image.source. The workflow only publishes images; it never commits.
# Path filters apply to branch pushes only; GitHub does not evaluate them for tag pushes.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - backend/**
      - api/**
      - Dockerfile
      - web/**
  workflow_dispatch:

# Serialise releases per ref; never cancel a run that is pushing an image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/proreta-io/proreta-backend
            context: .
            file: Dockerfile
          - name: web
            image: ghcr.io/proreta-io/proreta-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute version
        id: vars
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="sha-${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Tags only: the chart version and appVersion are the release (vX.Y.Z[-pre] -> X.Y.Z[-pre]), so the packaged
  # chart defaults image.tag to the images built above. Never runs for pushes to main.
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep in step with HELM_VERSION in ci.yml.
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.6
      - name: Package and push the chart
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vX.Y.Z or vX.Y.Z-<prerelease>" >&2
            exit 1
          fi
          # The chart has no defaults for config.publicUrl and the Gateway: lint with the example values.
          helm lint --strict deploy/helm/proreta -f deploy/helm/proreta/values.example.yaml --set image.tag="$version"
          helm package deploy/helm/proreta --version "$version" --app-version "$version" -d "$RUNNER_TEMP/chart"
          printf '%s' "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "$RUNNER_TEMP/chart/proreta-${version}.tgz" oci://ghcr.io/proreta-io/charts
          helm registry logout ghcr.io
